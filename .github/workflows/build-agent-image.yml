name: Build agent image

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      latest:
        required: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/build-agent/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: KUBWAVE_VERSION=${{ inputs.version }}
          tags: |
            ghcr.io/kubwave/build-agent:${{ inputs.version }}
            ${{ inputs.latest && 'ghcr.io/kubwave/build-agent:latest' || '' }}
          cache-from: type=gha,scope=build-agent
          cache-to: type=gha,mode=max,scope=build-agent

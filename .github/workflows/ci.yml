name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kubwave_test
          POSTGRES_PASSWORD: kubwave_test
          POSTGRES_DB: kubwave_build_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kubwave_test -d kubwave_build_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Verify template catalog
        run: bun run --filter=@kubwave/templates check:catalog

      - name: Typecheck
        run: bun run check-types

      - name: Test
        run: bun run test
        env:
          # Unit tests use mocks; build-agent integration tests use the dedicated PostgreSQL service.
          DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
          BUILD_AGENT_TEST_DATABASE_URL: postgres://kubwave_test:kubwave_test@127.0.0.1:5432/kubwave_build_test

      - name: Build
        run: bun run build
